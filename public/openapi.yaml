  /api/users/{id}/request:
    post:
      description: >-
        Send a typed user-to-user request.

        Supported types: `follow:accept`, `follow:reject`, `location:request`,
        `location:invite`, `ping`.
      operationId: UsersController_respondToRequest
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequestDto'
            examples:
              follow:accept:
                summary: follow:accept
                description: >-
                  Accept a pending follow request from `:id`. Returns the
                  resulting relation.
                value:
                  type: follow:accept
                  key: follow:42:7
              follow:reject:
                summary: follow:reject
                description: >-
                  Reject a pending follow request from `:id`. Returns the
                  resulting relation.
                value:
                  type: follow:reject
                  key: follow:42:7
              location:request:
                summary: location:request
                description: >-
                  Ask `:id` to share their location. Persisted (24h) and
                  federated to remote users.
                value:
                  type: location:request
                  key: loc:42:7
                  data:
                    label: Where are you?
              location:invite:
                summary: location:invite
                description: >-
                  Invite `:id` to a location. Persisted (24h) and federated to
                  remote users.
                value:
                  type: location:invite
                  key: inv:42:7
                  data:
                    location: i:12@example.com
                    label: Come join us
              ping:
                summary: ping
                description: >-
                  Transient notification pushed only to `:id`'s WebSocket
                  clients (never persisted, immediate expiry).
                value:
                  type: ping
                  data:
                    title: Hello!
                    label: ping
      responses:
        '200':
          description: ''
          content:
            application/json:
              schema:
                type: object
