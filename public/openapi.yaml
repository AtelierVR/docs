        Reserve a file slot and return its signed upload URL (status
        "awaiting").
      operationId: WorldsController_initUploadFile
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: releaseId
          required: true
          in: path
          schema:
            type: string
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/InitUploadFileDto'
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Init file upload
      tags:
        - world
  /api/worlds/{id}/releases/{releaseId}/files/{fileId}:
    put:
      description: >-
        Stream the raw file content (application/octet-stream). The bytes are
        verified and the slot is queued for validation (status "queued"); the
        bundle analysis and the storage write then run in the background
        ("processing" → "completed", or "failed"). Poll the file until it is
        stable (no refetch_at). Requires owner/contributor/admin. Optional
        integrity headers: Content-Hash, Content-Signature, Content-Length,
        Content-Disposition.
      operationId: WorldsController_storeUploadFile
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: releaseId
          required: true
          in: path
          schema:
            type: string
        - name: fileId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Upload file bytes
      tags:
        - world
  /api/worlds/{id}/releases/{releaseId}/files/{fileId}/status:
    get:
      description: >-
        Return a file slot status (IApiFile) without streaming its bytes. Poll
        it while `refetch_at` is not null.
      operationId: WorldsController_getUploadFileStatus
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: releaseId
          required: true
          in: path
          schema:
            type: string
        - name: fileId
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Get file status
      tags:
        - world
  /api/worlds/{id}/images:
    post:
      description: >-
        Upload an image (multipart/form-data, field: file) and attach it to the
        asset (owner, contributor or admin only).
      operationId: WorldsController_addAssetImage
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
      responses:
        '201':
          description: ''
      security:
        - bearer: []
      summary: Upload asset image
      tags:
        - world
  /api/worlds/{id}/images/{index}:
    delete:
      description: >-
        Remove an asset image by its zero-based index (owner, contributor or
        admin only).
      operationId: WorldsController_removeAssetImage
      parameters:
        - name: id
          required: true
          in: path
          schema:
            type: string
        - name: index
          required: true
          in: path
          schema:
            type: string
      responses:
        '200':
          description: ''
      security:
        - bearer: []
      summary: Delete asset image
      tags:
        - world
info:
  title: NOX API
  description: NOX REST API
  version: '1.0'
  contact: {}
tags: []
servers: []
components:
  securitySchemes:
    bearer:
      type: apiKey
      in: header
      name: Authorization
      x-auth-scheme: Bearer
      x-token-format: token
      description: User session token. Obtained from POST /api/auth/login.
    nox-challenge:
      type: apiKey
      in: header
      name: Authorization
      x-auth-scheme: Challenge
      x-token-format: <keyId_b64url>.<data_b64url>.<sig_b64url>
      description: >-
        Nox server-to-server challenge token. The payload is RSA-OAEP encrypted
        with the target server's public key and RSA-SHA256 signed with the
        sending server's private key.
    nox-as:
      type: apiKey
      in: header
      name: X-Nox-As
      x-token-format: number
      description: >-
        Internal user identifier of the federated user on whose behalf the
        remote server is acting. Only meaningful alongside a valid
        `nox-challenge` token.
  schemas:
    WebFingerLinkDto:
      type: object
      properties:
        rel:
          type: string
          description: Link relation type
          example: self
        type:
          type: string
          description: MIME type of the linked resource
          example: application/activity+json
        href:
          type: string
          description: URL of the linked resource
          example: https://example.com/users/alice
        template:
          type: string
          description: URL template with {uri} placeholder
          example: https://example.com/.well-known/webfinger?resource={uri}
      required:
        - rel
    WebFingerDocumentDto:
      type: object
      properties:
        subject:
          type: string
          description: 'Canonical identifier of the subject (acct: URI or URL)'
          example: acct:alice@example.com
        aliases:
          description: Alternate identifiers for the subject
          example:
            - https://example.com/users/alice
          type: array
          items:
            type: string
        links:
          description: Links describing the subject
          type: array
          items:
            $ref: '#/components/schemas/WebFingerLinkDto'
      required:
        - subject
        - links
    NodeInfoLinkDto:
      type: object
      properties:
        rel:
          type: string
          description: Relation type (schema URL)
          example: http://nodeinfo.diaspora.software/ns/schema/2.1
        href:
          type: string
          description: URL to the NodeInfo document
          example: https://example.com/nodeinfo/2.1
      required:
        - rel
        - href
    NodeInfoLinksDto:
      type: object
      properties:
        links:
          description: NodeInfo document links
          type: array
          items:
            $ref: '#/components/schemas/NodeInfoLinkDto'
      required:
        - links
    NoxSoftwareDto:
      type: object
      properties:
        name:
          type: string
          description: Software name
          example: nox
        version:
          type: string
          description: Software version string
          example: 1.0.0
      required:
        - name
        - version
    NoxGatewayDto:
      type: object
      properties:
        web:
          type: string
          description: HTTP/HTTPS base URL
          example: https://example.com
        ws:
          type: string
          description: WebSocket URL
          example: wss://example.com/api/ws
        api:
          type: string
          description: Public REST API base URL
          example: https://example.com/api/
      required:
        - web
        - ws
        - api
    NoxEndpointsDto:
      type: object
      properties:
        wellknown:
          type: string
          description: URL of this well-known document
          example: https://example.com/.well-known/nox
        webfinger:
          type: string
          description: WebFinger template URL with {uri} placeholder
          example: https://example.com/.well-known/webfinger?resource={uri}
        nodeinfo:
          type: string
          description: NodeInfo links document URL
          example: https://example.com/.well-known/nodeinfo
        configs:
          type: string
          description: URL of the server's Configuration
          example: https://example.com/api/configs
      required:
        - wellknown
        - webfinger
        - nodeinfo
        - configs
    NoxVersionsDto:
      type: object
      properties:
        node:
          type: string
          description: Node.js runtime version
          example: 20.0.0
        terms:
          type: string
          description: Terms of service document version
          example: '1.0'
        privacy:
          type: string
          description: Privacy policy document version
          example: '1.0'
        rules:
          type: string
          description: Rules document version
          example: '1.0'
      required:
        - node
        - terms
        - privacy
        - rules
    NoxMetadataDto:
      type: object
      properties:
        title:
          description: Instance display name. Either a plain string or a locale→string map.
          oneOf:
            - type: string
              example: My Nox Server
            - type: object
              additionalProperties:
                type: string
              example:
                en: My Nox Server
                fr: Mon Serveur Nox
        description:
          description: >-
            Instance description, or null. Either a plain string or a
            locale→string map.
          nullable: true
          oneOf:
            - type: string
              example: A social VR platform.
            - type: object
              additionalProperties:
                type: string
              example:
                en: A social VR platform.
                fr: Une plateforme VR sociale.
        icon:
          description: >-
            Instance icon. Either a single URL string, a theme-keyed map (e.g. {
            default: "url", dark: "url" }), or null.
          nullable: true
          oneOf:
            - type: string
              example: https://example.com/icon.png
            - type: object
              additionalProperties:
                type: string
              example:
                default: https://example.com/icon.png
                dark: https://example.com/icon.dark.png
        contact:
          type: string
          description: Contact info (email or URL), or null
          example: null
          nullable: true
        socials:
          type: object
          additionalProperties:
            oneOf:
              - type: string
              - type: array
                items:
                  type: string
          description: >-
            Social links map. Keys are platform names (e.g. github, mastodon,
            discord, twitter, youtube); values are URL or array of URLs.
          example:
            github: https://github.com/org
            mastodon:
              - https://mastodon.social/@me
      required:
        - title
    NoxWellKnownDto:
      type: object
      properties:
        id:
          type: string
          description: Unique node identifier within a cluster
          example: node-abc123
        software:
          description: Software info
          allOf:
            - $ref: '#/components/schemas/NoxSoftwareDto'
        status:
          type: string
          description: Operational status
          enum:
            - online
            - maintenance
            - degraded
          example: online
        started:
          type: number
          description: Unix timestamp (ms) when this node started
          example: 1700000000000
        public:
          type: string
          description: Ed25519 public key (base64 SPKI DER)
          example: MCowBQYDK2VwAyEA…
        address:
          type: string
          description: Public domain address
          example: example.com
        port:
          type: number
          description: Listening port
          example: 443
        gateway:
          description: Gateway URLs
          allOf:
            - $ref: '#/components/schemas/NoxGatewayDto'
        endpoints:
          description: Protocol endpoint URLs
          allOf:
            - $ref: '#/components/schemas/NoxEndpointsDto'
        versions:
          description: Runtime versions
          allOf:
            - $ref: '#/components/schemas/NoxVersionsDto'
        metadata:
          description: Instance metadata
          allOf:
            - $ref: '#/components/schemas/NoxMetadataDto'
        features:
          description: Supported feature flags
          example: []
          type: array
          items:
            type: string
        capabilities:
          description: Supported capability flags
          example: []
          type: array
          items:
            type: string
        maintenance:
          type: string
          description: Maintenance message displayed to users, or null
          example: null
          nullable: true
      required:
        - id
        - software
        - status
        - started
        - public
        - address
        - port
        - gateway
        - endpoints
        - versions
        - metadata
        - features
        - capabilities
    NodeInfoSoftwareDto:
      type: object
      properties:
        name:
          type: string
          description: Software name
          example: nox
        version:
          type: string
          description: Software version
          example: 1.0.0
        repository:
          type: string
          description: Source code repository URL
          example: https://github.com/example/nox
        homepage:
          type: string
          description: Project homepage URL
          example: https://example.com
      required:
        - name
        - version
    NodeInfoServicesDto:
      type: object
      properties:
        inbound:
          description: Protocols used to receive content
          example: []
          type: array
          items:
            type: string
        outbound:
          description: Protocols used to publish content
          example: []
          type: array
          items:
            type: string
      required:
        - inbound
        - outbound
    NodeInfoUsageUsersDto:
      type: object
      properties:
        total:
          type: number
          description: Total registered user count
          example: 100
        activeMonth:
          type: number
          description: Users active in the past month
          example: 50
        activeHalfyear:
          type: number
          description: Users active in the past half-year
          example: 75
      required:
        - total
        - activeMonth
        - activeHalfyear
    NodeInfoUsageDto:
      type: object
      properties:
        users:
          description: User activity statistics
          allOf:
            - $ref: '#/components/schemas/NodeInfoUsageUsersDto'
        localPosts:
          type: number
          description: Total local posts
          example: 0
        localComments:
          type: number
          description: Total local comments
          example: 0
      required:
        - users
        - localPosts
    NodeInfoDocumentDto:
      type: object
      properties:
        version:
          type: string
          description: NodeInfo schema version
          example: '2.1'
        software:
          description: Server software info
          allOf:
            - $ref: '#/components/schemas/NodeInfoSoftwareDto'
        protocols:
          description: Supported federation protocols
          example: []
          type: array
          items:
            type: string
        services:
          description: Federation services (feed readers, bridges…)
          allOf:
            - $ref: '#/components/schemas/NodeInfoServicesDto'
        usage:
          description: Usage statistics
          allOf:
            - $ref: '#/components/schemas/NodeInfoUsageDto'
        openRegistrations:
          type: boolean
          description: Whether open registration is enabled
          example: true
        metadata:
          type: object
          description: >-
            Free-form extras — the Nox asset counters (`assets: { world, avatar,
            mod }`) and the number of `instances`.
          example:
            assets:
              world: 2
              avatar: 1
              mod: 19
            instances: 3
      required:
        - version
        - software
        - protocols
        - services
        - usage
        - openRegistrations
        - metadata
    ApiErrorDetailsDto:
      type: object
      properties:
        code:
          type: string
          description: Upper-snake-case error code
          example: NOT_FOUND
        message:
          type: string
          description: Human-readable error description
          example: Resource not found.
        status:
          type: integer
          description: HTTP status code
          example: 404
      required:
        - code
        - message
        - status
    ApiLinkResponseDto:
      type: object
      properties:
        label:
          type: string
          description: Link display label
          example: GitHub
        value:
          type: string
          description: Link URL
          example: https://github.com/johndoe
      required:
        - label
        - value
    ApiUserRelationsDto:
      type: object
      properties:
        out:
          type: string
          description: Outgoing relation type from current user to subject, or null
          example: follow
          nullable: true
        in:
          type: string
          description: Incoming relation type from subject to current user, or null
          example: null
          nullable: true
    ApiUserPresenceDto:
      type: object
      properties:
        status:
          type: string
          description: Presence status
          enum:
            - offline
            - dnd
            - stream
            - busy
            - online
            - event
            - public
          example: online
        text:
          type: string
          description: Custom presence status text, or null
          example: In a meeting
          nullable: true
        locations:
          description: >-
            List of instance identifiers the user is currently in (an identifier
            may carry a `?private` flag). null means the viewer has no
            permission to see this field.
          example:
            - 42@example.com
          nullable: true
          type: array
          items:
            type: string
      required:
        - status
    ApiAliasDto:
      type: object
      properties:
        key:
          type: string
          description: Alias key name
          example: iid
        value:
          type: string
          description: Alias value (NoxIdentifier or string)
          example: 1@my-server.com
      required:
        - key
        - value
    ApiCurrentUserDto:
      type: object
      properties:
        id:
          type: number
          description: Internal numeric user ID
          example: 1
        username:
          type: string
          description: Unique username (lowercase)
          example: johndoe
        display:
          type: string
          description: Public display name
          example: John Doe
        bio:
          type: string
          description: User biography, or null
          example: Full-stack developer
          nullable: true
        pronoun:
          type: string
          description: Pronouns, or null
          example: he/him
          nullable: true
        server:
          type: string
          description: Server hostname this user belongs to
          example: my-server.com
        tags:
          description: User-defined tags
          example: []
          type: array
          items:
            type: string
        thumbnail:
          type: string
          description: URL to profile thumbnail, or null
          example: https://cdn.my-server.com/thumb.png
          nullable: true
        banner:
          type: string
          description: URL to profile banner, or null
          example: null
          nullable: true
        links:
          description: External links
          type: array
          items:
            $ref: '#/components/schemas/ApiLinkResponseDto'
        relations:
          description: Relationship to the requesting user, or null if not applicable
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiUserRelationsDto'
        public:
          type: string
          description: Ed25519 public key (base64 SPKI DER)
          example: MCow...==
        followers:
          type: number
          description: Number of followers
          example: 42
        following:
          type: number
          description: Number of users this user follows
          example: 17
        presence:
          description: Current presence status
          allOf:
            - $ref: '#/components/schemas/ApiUserPresenceDto'
        alias:
          description: Aliases (NoxIdentifier extras)
          type: array
          items:
            $ref: '#/components/schemas/ApiAliasDto'
        email:
          type: string
          description: Email address, or null
          example: john@example.com
          nullable: true
        methods:
          type: object
          description: >-
            Authentication methods and their status (email:
            verified|unverified|disabled, totp: enabled|disabled, passkey:
            enabled|disabled)
          example:
            email: verified
            totp: disabled
            passkey: enabled
          additionalProperties:
            type: string
        created_at:
          type: number
          description: Account creation timestamp (Unix ms)
          example: 1680000000000
        home:
          type: string
          description: Home world identifier, or null
          example: null
          nullable: true
        avatar:
          type: string
          description: Active avatar identifier, or null
          example: null
          nullable: true
      required:
        - id
        - username
        - display
        - server
        - tags
        - links
        - public
        - followers
        - following
        - presence
        - alias
        - methods
        - created_at
    ApiLinkDto:
      type: object
      properties:
        label:
          type: string
          description: Link display label
          example: GitHub
        value:
          type: string
          description: Link URL
          example: https://github.com/johndoe
      required:
        - label
        - value
    UpdateUserDto:
      type: object
      properties:
        username:
          type: string
          description: >-
            New unique username (lowercase letters, numbers, dots, hyphens,
            underscores)
          example: johndoe
        display:
          type: string
          description: New display name
          example: John Doe
        bio:
          type: string
          description: Biography text (max 4096 characters), or null to clear
          example: Full-stack developer
          nullable: true
        pronoun:
          type: string
          description: Pronouns, or null to clear
          example: he/him
          nullable: true
        email:
          type: string
          description: New email address, or null to remove
          example: john@example.com
          nullable: true
        current_password:
          type: string
          description: Required when changing the password
          example: oldpassword
        password:
          type: string
          description: New password (6-128 characters)
          example: newpassword
        links:
          description: External links list, or null to clear
          nullable: true
          type: array
          items:
            $ref: '#/components/schemas/ApiLinkDto'
        tags:
          description: Tags list (usr:* snake_case:snake_case format), or null to clear
          example:
            - usr:developer
            - usr:gamer
          nullable: true
          type: array
          items:
            type: string
        thumbnail:
          type: string
          description: Thumbnail URL, or null to clear
          example: null
          nullable: true
        banner:
          type: string
          description: Banner URL, or null to clear
          example: null
          nullable: true
        home:
          type: string
          example: null
          nullable: true
          description: Home world identifier
        avatar:
          type: string
          example: null
          nullable: true
          description: Active avatar identifier
        presence:
          type: string
          description: 'Presence status: offline, dnd, stream, busy, online, event, public'
          example: online
        presence_status:
          type: string
          description: Custom presence status text, or null to clear
          example: In a meeting
          nullable: true
        factor_code:
          type: string
          description: Verification code (6 characters), required for sensitive operations
          example: '123456'
    ApiSuccessDto:
      type: object
      properties:
        success:
          type: boolean
          description: Whether the operation succeeded
          example: true
      required:
        - success
    DeleteUserDto:
      type: object
      properties:
        factor_code:
          type: string
          description: >-
            Verification code (TOTP, email or passkey) proving the account owner
            approved the deletion
          example: '482913'
    ApiUserDto:
      type: object
      properties:
        id:
          type: number
          description: Internal numeric user ID
          example: 1
        username:
          type: string
          description: Unique username (lowercase)
          example: johndoe
        display:
          type: string
          description: Public display name
          example: John Doe
        bio:
          type: string
          description: User biography, or null
          example: Full-stack developer
          nullable: true
        pronoun:
          type: string
          description: Pronouns, or null
          example: he/him
          nullable: true
        server:
          type: string
          description: Server hostname this user belongs to
          example: my-server.com
        tags:
          description: User-defined tags
          example: []
          type: array
          items:
            type: string
        thumbnail:
          type: string
          description: URL to profile thumbnail, or null
          example: https://cdn.my-server.com/thumb.png
          nullable: true
        banner:
          type: string
          description: URL to profile banner, or null
          example: null
          nullable: true
        links:
          description: External links
          type: array
          items:
            $ref: '#/components/schemas/ApiLinkResponseDto'
        relations:
          description: Relationship to the requesting user, or null if not applicable
          nullable: true
          allOf:
            - $ref: '#/components/schemas/ApiUserRelationsDto'
        public:
          type: string
          description: Ed25519 public key (base64 SPKI DER)
          example: MCow...==
        followers:
          type: number
          description: Number of followers
          example: 42
        following:
          type: number
          description: Number of users this user follows
          example: 17
        presence:
          description: Current presence status
          allOf:
            - $ref: '#/components/schemas/ApiUserPresenceDto'
        alias:
          description: Aliases (NoxIdentifier extras)
          type: array
          items:
            $ref: '#/components/schemas/ApiAliasDto'
      required:
        - id
        - username
        - display
        - server
        - tags
        - links
        - public
        - followers
        - following
        - presence
        - alias
    UserSearchResponseDto:
      type: object
      properties:
        total:
          type: number
          description: Total number of users matching the query
          example: 100
        query:
          type: string
          description: Free-text search query that was applied
          example: john
          nullable: true
        ids:
          description: >-
            List of NoxIdentifier strings queried by ID (empty if text search
            was used)
          example: []
          type: array
          items:
            type: string
        limit:
          type: number
          description: Page size
          example: 10
        offset:
          type: number
          description: Page offset
          example: 0
        items:
          description: Matching users
          type: array
          items:
            $ref: '#/components/schemas/ApiUserDto'
      required:
        - total
        - ids
        - limit
        - offset
        - items
    ApiRelationDto:
      type: object
      properties:
        id:
          type: string
          description: Relation identifier
          example: rel_1
        type:
          type: string
          description: Relation type (follow, request, block)
          example: follow
        initiator:
          type: string
          description: Initiator user NoxIdentifier
          example: 1@my-server.com
        target:
          type: string
          description: Target user NoxIdentifier
          example: 2@my-server.com
