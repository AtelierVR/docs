    RequestDataDto:
      type: object
      properties: {}
    RequestDto:
      type: object
      properties:
        type:
          type: string
          enum:
            - follow:accept
            - follow:reject
            - location:request
            - location:invite
            - ping
          description: >-
            Request type. One of: `follow:accept`, `follow:reject`,
            `location:request`, `location:invite`, `ping`.
          example: location:request
        key:
          type: string
          description: >-
            Idempotency key (3–50 characters, lowercase letters, digits, `_` and
            `:` only).
          example: loc:42:7
          minLength: 3
          maxLength: 50
          pattern: ^[a-z0-9_:]+$
        data:
          description: >-
            Type-specific payload. Its shape depends on `type` (see the request
            examples).
          oneOf:
            - $ref: '#/components/schemas/RequestFollowDataDto'
            - $ref: '#/components/schemas/RequestLocationRequestDataDto'
            - $ref: '#/components/schemas/RequestLocationInviteDataDto'
            - $ref: '#/components/schemas/RequestPingDataDto'
          allOf:
            - $ref: '#/components/schemas/RequestDataDto'
      required:
        - type
