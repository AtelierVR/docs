                  - data
                  - error
                  - time
                  - request
                properties:
                  data:
                    $ref: '#/components/schemas/ApiCurrentUserDto'
                    description: Response payload.
                  error:
                    type: 'null'
                    example: null
                    description: Always null for successful responses.
                  time:
                    type: integer
                    example: 1680000000000
                    description: Unix timestamp (ms) when the response was generated.
                  request:
                    type: string
                    example: /api/endpoint
                    description: Request path that produced this response.
        '401':
