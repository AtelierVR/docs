            Free-form file attributes (not Nox tags). Expected keys: platform,
            arch, engine (value "<engine>[:<version>]"). Used by type-specific
            validators (avatar/world).
          type: array
          items:
            $ref: '#/components/schemas/UploadAttributeDto'
    UpdateUploadAssetDto:
      type: object
      properties:
